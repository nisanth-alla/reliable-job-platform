services:
  postgres:
    image: postgres:16-alpine
    container_name: reliable-job-postgres
    environment:
      POSTGRES_USER: reliable
      POSTGRES_PASSWORD: reliable
      POSTGRES_DB: reliable_jobs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reliable -d reliable_jobs"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reliable-job-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
